<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="atras"><a href="/index.html">SLD</a></div>
  </header>
  <main>
    <section class="login">
      <h1>SLD</h1>
      <P>Servicio de limpieza a domicilio</P>
      <form class="formulario" action="" method="get">

        <div class="container">
          <label for="mail"><b>Correo electronico</b></label>
          <input type="email" placeholder="Ingresa tu Correo" name="mail" required>

          <label for="psw"><b>Contraseña</b></label>
          <input type="password" placeholder="Ingresa tu contraseña" name="psw" required>

          <button type="submit"><a class="a-login" href="/menu.html">Login</a></button>
          <label>
            <input type="checkbox" checked="checked" name="remember"> Recuerdame
          </label>
        </div>

        <div class="container" style="background-color:#f1f1f1">
          <button type="button" class="cancelbtn">Cancelar</button>
          <span class="psw">Olvido la <a href="#">contraseña?</a></span>
        </div>
      </form>
    </section>
  </main>
  <footer>

  </footer>
  <script src="app.js"></script>
</body>

</html>
