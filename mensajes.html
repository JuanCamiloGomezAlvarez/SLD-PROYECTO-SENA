      <h1>SLD</h1>
      <!-- <P>Servicio de limpieza a domicilio</P> -->
      <h2>Mensajeria</h2>

      <p>Genera aqui los mensajes que tus usuarios recibiran.</p>

      <form class="formulario" action="" method="get">
        <div class="container">
          <label for="trabajador"><b>Trabajador</b></label>
          <textarea name="trabajador" id="" placeholder="Ej: Hola {{trabajador}} por favor ve a la casa de {{cliente}} en la dirección {{direccion}}  el dia {{dia}} a la hora {{hora}}  y trabaja alli por un total de {{horas}}, gracias. "></textarea>

          <label for="cliente"><b>Cliente</b></label>
          <textarea name="cliente" id="" placeholder="Ej: Hola profe buen dia, espero se encuentre muy bien. yo ando aqui rompiendome la cabeza con bases de datos y con la API de WhatsApp, pero pues nadie me mando asi que a seguirle dando. "></textarea>


          <button type="submit"><a class="a-botones" href="">Generar</a></button>

      </form>
      
    </section>
